// ─── UTILS ──────────────────────────────────────────────────────────────────
function sanitizeText(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#x27;");
}

// Formatea cualquier fecha al formato DD/MM/AAAA
// Soporta: "2025-09-15", "15/09/2025", "09/15/2025", timestamps, Date objects
function formatFecha(valor) {
  if (!valor) return "";
  const s = String(valor).trim();

  // Ya está en DD/MM/AAAA
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;

  // ISO: AAAA-MM-DD (con o sin hora)
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;

  // MM/DD/AAAA → DD/MM/AAAA (formato estadounidense)
  const us = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (us) return `${us[2].padStart(2,"0")}/${us[1].padStart(2,"0")}/${us[3]}`;

  // Intentar parsear con Date como último recurso
  const d = new Date(s);
  if (!isNaN(d.getTime())) {
    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    return `${dd}/${mm}/${d.getFullYear()}`;
  }

  // Si no se puede parsear, devolver el valor original
  return s;
}

async function hashPassword(password) {
  const buf  = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function isValidDriveUrl(url) {
  if (!url || typeof url !== "string") return false;
  try {
    const u = new URL(url);
    return u.hostname === "drive.google.com" || u.hostname === "docs.google.com";
  } catch { return false; }
}

function getDriveEmbedUrl(url) {
  if (!isValidDriveUrl(url)) return null;
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (!m) return null;
  return `https://drive.google.com/file/d/${encodeURIComponent(m[1])}/preview`;
}

// ─── API ────────────────────────────────────────────────────────────────────
async function apiLogin(email, password) {
  const passwordHash = await hashPassword(password);
  const params = new URLSearchParams({
    key: API_KEY, action: "login",
    email: email.trim().toLowerCase(), passwordHash,
  });
  const res  = await fetch(`${PROXY_URL}?${params}`, { credentials: "omit" });
  if (!res.ok) throw new Error(`Error de red (${res.status})`);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "Credenciales incorrectas");
  return data; // { token, name, role, sucursal }
}

async function apiLogout(token) {
  if (!token) return;
  const params = new URLSearchParams({ key: API_KEY, action: "logout", token });
  fetch(`${PROXY_URL}?${params}`, { credentials: "omit" }).catch(() => {});
}

  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Error al procesar remito');
  return data;
}

async function apiEditarRemito(sucursal, rowIndex, campos, token) {
  const params = new URLSearchParams({ key: API_KEY, action: 'editarRemito', sucursal, rowIndex, token, ...campos });
  const res  = await fetch(`${PROXY_URL}?${params}`, { credentials: 'omit' });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Error al guardar');
  return data;
}

// Extrae el ID de Drive de cualquier formato de URL o ID directo
function extractDriveId(linkOrId) {
  if (!linkOrId) return null;
  // Si ya es un ID puro (no tiene /)
  if (!linkOrId.includes('/')) return linkOrId.trim();
  // Extraer de URL tipo /file/d/ID/...
  const m = linkOrId.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

// Genera URL de preview embebible según tipo de archivo
function getEmbedInfo(link, archivo) {
  const fileId = extractDriveId(link);
  if (!fileId) return null;

  const nombre = (archivo || '').toLowerCase();
  const esImagen = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(nombre);
  const esPDF    = /\.pdf$/i.test(nombre);

  if (esImagen) {
    return {
      tipo: 'imagen',
      url:  `https://drive.google.com/thumbnail?id=${fileId}&sz=w1200`,
    };
  }
  if (esPDF) {
    return {
      tipo: 'pdf',
      url:  `https://drive.google.com/file/d/${fileId}/preview`,
    };
  }
  // Cualquier otro tipo: preview genérico de Drive
  return {
    tipo: 'drive',
    url:  `https://drive.google.com/file/d/${fileId}/preview`,
  };
}


async function fetchRemitos(sucursal, role, token) {
  const params = new URLSearchParams({ key: API_KEY, action: "remitos", sucursal, role, token });
  const res    = await fetch(`${PROXY_URL}?${params}`, { credentials: "omit" });
  if (!res.ok) throw new Error(`Error de red (${res.status})`);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return (data.remitos || []).map(r => ({
    archivo:   sanitizeText(r.archivo),
    remito:    sanitizeText(r.remito),
    fecha:     formatFecha(r.fecha),
    cliente:   sanitizeText(r.cliente),
    link:      isValidDriveUrl(r.link) ? r.link : "",
    procesado: sanitizeText(r.procesado),
  }));
}

// ─── SESSION TIMEOUT ─────────────────────────────────────────────────────────
function useSessionTimeout(active, onTimeout) {
  const timerRef = useRef(null);
  const [warn, setWarn] = useState(false);

  const reset = useCallback(() => {
    clearTimeout(timerRef.current);
    setWarn(false);
    if (!active) return;
    timerRef.current = setTimeout(() => {
      setWarn(true);
      timerRef.current = setTimeout(onTimeout, 2 * 60 * 1000);
    }, SESSION_TIMEOUT_MS - 2 * 60 * 1000);
  }, [active, onTimeout]);

  useEffect(() => {
    if (!active) { clearTimeout(timerRef.current); setWarn(false); return; }
    const evs = ["mousemove","keydown","click","scroll","touchstart"];
    evs.forEach(e => document.addEventListener(e, reset, { passive: true }));
    reset();
    return () => { clearTimeout(timerRef.current); evs.forEach(e => document.removeEventListener(e, reset)); };
  }, [active, reset]);

  return warn;
}

// ─── PWA INSTALL ─────────────────────────────────────────────────────────────
function usePWAInstall() {
  const [prompt, setPrompt] = useState(null);
  const [installed, setInstalled] = useState(false);
  useEffect(() => {
    const h = e => { e.preventDefault(); setPrompt(e); };
    window.addEventListener("beforeinstallprompt", h);
    window.addEventListener("appinstalled", () => setInstalled(true));
    return () => window.removeEventListener("beforeinstallprompt", h);
  }, []);
  const install = async () => {
    if (!prompt) return;
    prompt.prompt();
    const { outcome } = await prompt.userChoice;
    if (outcome === "accepted") setInstalled(true);
    setPrompt(null);
  };
  return { canInstall: !!prompt && !installed, install };
}

// ─── LOGIN ───────────────────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [email,    setEmail]    = useState("");
  const [password, setPassword] = useState("");
  const [error,    setError]    = useState("");
  const [loading,  setLoading]  = useState(false);
  const [showPass, setShowPass] = useState(false);
  const [shake,    setShake]    = useState(false);
  const [attempts,  setAttempts]  = useState(0);
  const [lockUntil, setLockUntil] = useState(0);
  const [lockSecs,  setLockSecs]  = useState(0);

  useEffect(() => {
    if (!lockUntil) return;
    const iv = setInterval(() => {
      const rem = Math.max(0, Math.ceil((lockUntil - Date.now()) / 1000));
      setLockSecs(rem);
      if (rem === 0) { setLockUntil(0); setAttempts(0); clearInterval(iv); }
    }, 500);
    return () => clearInterval(iv);
  }, [lockUntil]);

  const isLocked = lockUntil > Date.now();

  const handleSubmit = async () => {
    if (isLocked || loading || !email || !password) return;
    setLoading(true); setError("");
    try {
      const data = await apiLogin(email, password);
      setAttempts(0);
      onLogin({ token: data.token, name: data.name, role: data.role, sucursal: data.sucursal });
    } catch (e) {
      const n = attempts + 1;
      setAttempts(n);
      if (n >= MAX_LOGIN_ATTEMPTS) {
        setLockUntil(Date.now() + LOCKOUT_DURATION_MS);
        setError(`Demasiados intentos. Esperá ${LOCKOUT_DURATION_MS / 1000}s.`);
      } else {
        setError(`${e.message} (${n}/${MAX_LOGIN_ATTEMPTS} intentos)`);
      }
      setShake(true); setTimeout(() => setShake(false), 400);
    } finally { setLoading(false); }
  };

  const iStyle = err => ({
    width:"100%",padding:"12px 14px",background:"rgba(255,255,255,.04)",
    border:`1px solid ${err?"var(--accent2)":"rgba(255,255,255,.1)"}`,
    borderRadius:10,color:"var(--text)",fontSize:14,outline:"none",transition:"border .2s",
  });

  return (
    <div style={{ minHeight:"100vh", display:"flex", background:"var(--bg)" }}>
      {window.innerWidth >= 768 && (
        <div style={{ width:420,flexShrink:0,background:"linear-gradient(160deg,#0d1f5c,#0a0c14)",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:28,borderRight:"1px solid var(--border)",padding:48 }}>
          <img src={LOGO} alt="File Protection" style={{ width:100,filter:"drop-shadow(0 8px 40px rgba(39,86,214,.55))" }} />
          <div style={{ textAlign:"center" }}>
            <div style={{ fontFamily:"Syne",fontSize:26,fontWeight:800,color:"#fff",marginBottom:10 }}>File Protection</div>
            <div style={{ color:"rgba(255,255,255,.4)",fontSize:14,maxWidth:260,lineHeight:1.7 }}>Sistema de gestión y consulta de remitos por sucursal</div>
          </div>
          <div style={{ display:"flex",gap:12 }}>
            {Object.values(SHEETS).map(s => (
              <div key={s.label} style={{ padding:"7px 16px",borderRadius:20,background:s.colorBg,border:`1px solid ${s.color}44`,color:s.color,fontSize:13,fontWeight:500 }}>
                {s.icon} {s.label}
              </div>
            ))}
          </div>
          <div style={{ marginTop:"auto",color:"rgba(255,255,255,.2)",fontSize:11,textAlign:"center" }}>📱 Instalable como app · Funciona offline</div>
        </div>
      )}

      <div style={{ flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:24 }}>
        <div className={`slide-up ${shake ? "shake" : ""}`} style={{ width:"100%",maxWidth:400 }}>
          <div style={{ textAlign:"center",marginBottom:32 }}>
            <h1 style={{ fontFamily:"Syne",fontSize:26,fontWeight:800,marginBottom:6 }}>Bienvenido</h1>
            <p style={{ color:"var(--muted)",fontSize:14 }}>Ingresá con tu cuenta para continuar</p>
          </div>
          <div style={{ background:"var(--surface)",border:"1px solid var(--border)",borderRadius:20,padding:"36px 32px",boxShadow:"0 24px 60px rgba(0,0,0,.4)" }}>
            <div style={{ display:"flex",flexDirection:"column",gap:18 }}>
              <div>
                <label style={{ display:"block",fontSize:11,fontWeight:600,color:"var(--muted)",marginBottom:8,textTransform:"uppercase",letterSpacing:".7px" }}>Email</label>
                <input value={email} onChange={e => setEmail(e.target.value.trim())} onKeyDown={e => e.key === "Enter" && handleSubmit()}
                  type="email" placeholder="tu@email.com" autoComplete="email" maxLength={100} disabled={isLocked}
                  style={iStyle(!!error)}
                  onFocus={e => e.target.style.borderColor="var(--accent-light)"}
                  onBlur={e => e.target.style.borderColor=error?"var(--accent2)":"rgba(255,255,255,.1)"} />
              </div>
              <div>
                <label style={{ display:"block",fontSize:11,fontWeight:600,color:"var(--muted)",marginBottom:8,textTransform:"uppercase",letterSpacing:".7px" }}>Contraseña</label>
                <div style={{ position:"relative" }}>
                  <input type={showPass?"text":"password"} value={password} onChange={e => setPassword(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && handleSubmit()} placeholder="••••••••"

                    style={{ ...iStyle(!!error), paddingRight:44 }}
                    onFocus={e => e.target.style.borderColor="var(--accent-light)"}
                    onBlur={e => e.target.style.borderColor=error?"var(--accent2)":"rgba(255,255,255,.1)"} />

                </div>
              </div>

              {error && (
                <div role="alert" style={{ padding:"10px 14px",borderRadius:8,background:"rgba(255,101,132,.08)",border:"1px solid rgba(255,101,132,.25)",color:"var(--accent2)",fontSize:13 }}>
                  ⚠️ {error}
                  {isLocked && lockSecs > 0 && <span style={{ display:"block",marginTop:4,fontSize:12 }}>Reintentá en {lockSecs}s</span>}
                </div>
              )}

              <button className="btn btn-primary" onClick={handleSubmit}
                disabled={loading || isLocked || !email || !password}
                style={{ width:"100%",justifyContent:"center",padding:14,fontSize:15,marginTop:4,borderRadius:10,fontWeight:600 }}>
                {loading
                  ? <><span style={{ animation:"spin 1s linear infinite",display:"inline-block" }}>⟳</span> Verificando...</>
                  : isLocked ? `🔒 Bloqueado (${lockSecs}s)` : "Ingresar →"}
              </button>
            </div>
          </div>
          <div style={{ textAlign:"center",marginTop:20,color:"var(--muted)",fontSize:12 }}>File Protection · Sistema de Remitos</div>
        </div>
      </div>
    </div>
  );
}

// ─── MODAL GESTIÓN DE SUCURSALES ──────────────────────────────────────────────
function GestionSucursales({ sucursales, onAdd, onDelete, onClose }) {
  const [slug,    setSlug]    = useState("");
  const [label,   setLabel]   = useState("");
  const [icon,    setIcon]    = useState("🏢");
  const [color,   setColor]   = useState("#3b82f6");
  const [loading, setLoading] = useState(false);
  const [msg,     setMsg]     = useState(null); // { text, type }
  const [confirm, setConfirm] = useState(null); // slug a eliminar

  const slugify = v => v.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");

  const handleAdd = async () => {
    if (!slug || !label) { setMsg({ text:"Completá nombre y slug.", type:"err" }); return; }
    setLoading(true); setMsg(null);
    try {
      const res = await onAdd(slug, label, icon, color);
      if (res.ok) {
        setMsg({ text: res.aviso || "Sucursal agregada.", type:"ok" });
        setSlug(""); setLabel(""); setIcon("🏢"); setColor("#3b82f6");
      } else {
        setMsg({ text: res.error || "Error al agregar.", type:"err" });
      }
    } catch { setMsg({ text:"Error de conexión.", type:"err" }); }
    finally  { setLoading(false); }
  };

  const handleDelete = async (s) => {
    setLoading(true); setConfirm(null); setMsg(null);
    try {
      const res = await onDelete(s);
      if (res.ok) setMsg({ text:`Sucursal "${s}" eliminada.`, type:"ok" });
      else        setMsg({ text: res.error || "Error.", type:"err" });
    } catch { setMsg({ text:"Error de conexión.", type:"err" }); }
    finally  { setLoading(false); }
  };

  const iStyle = { width:"100%", padding:"10px 12px", background:"rgba(255,255,255,.04)",
    border:"1px solid rgba(255,255,255,.1)", borderRadius:8, color:"var(--text)", fontSize:14,
    outline:"none", fontFamily:"inherit" };

    <div onClick={onClose} role="dialog" aria-modal="true" style={{ position:"fixed",inset:0,zIndex:1100,background:"rgba(0,0,0,.85)",backdropFilter:"blur(10px)",display:"flex",alignItems:"center",justifyContent:"center",padding:20 }}>

          <div style={{ fontFamily:"Syne",fontWeight:800,fontSize:18 }}>🏢 Gestión de Sucursales</div>
          <button onClick={onClose} style={{ background:"none",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:20 }} aria-label="Cerrar">✕</button>
        </div>

        <div style={{ padding:"24px" }}>
          {/* Lista actual */}
          <div style={{ marginBottom:28 }}>
            <div style={{ fontSize:11,fontWeight:600,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".6px",marginBottom:12 }}>Sucursales activas</div>
            {sucursales.length === 0
              ? <div style={{ color:"var(--muted)",fontSize:13,textAlign:"center",padding:"20px 0" }}>No hay sucursales configuradas</div>
              : sucursales.map(s => (
                <div key={s.slug} style={{ display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:"var(--surface2)",borderRadius:10,marginBottom:8,border:"1px solid var(--border)" }}>

                    <span style={{ fontSize:20 }}>{s.icon}</span>
                    <div>
                      <div style={{ fontWeight:600,fontSize:14,color:s.color }}>{s.label}</div>
                      <div style={{ fontSize:11,color:"var(--muted)" }}>slug: {s.slug}</div>
                    </div>
                  </div>
                  {confirm === s.slug

                <label style={{ fontSize:11,color:"var(--muted)",display:"block",marginBottom:8 }}>Color</label>
                <div style={{ display:"flex",gap:8,flexWrap:"wrap" }}>

                  ))}
                </div>
              </div>

              {msg && (
                <div role="alert" style={{ padding:"10px 14px",borderRadius:8,background:msg.type==="ok"?"rgba(74,222,128,.08)":"rgba(255,101,132,.08)",border:`1px solid ${msg.type==="ok"?"rgba(74,222,128,.25)":"rgba(255,101,132,.25)"}`,color:msg.type==="ok"?"#4ade80":"#ff6584",fontSize:13 }}>
                  {msg.type==="ok"?"✓":"⚠"} {msg.text}

              )}

              <button onClick={handleAdd} disabled={loading||!slug||!label} style={{ padding:"12px",borderRadius:10,background:"var(--accent-light)",border:"none",color:"#fff",fontWeight:600,fontSize:14,cursor:"pointer",fontFamily:"inherit",opacity:loading||!slug||!label?.5:1,transition:"all .2s" }}>

// ─── HELPERS DASHBOARD ────────────────────────────────────────────────────────
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const IS_PROC = v => ["si","sí","yes","true","1","x"].includes((v||"").toLowerCase());

// Agrupa remitos por mes (MM/AAAA) → { "09/2025": [r,r,...] }
function agruparPorMes(remitos) {
  const map = {};
  remitos.forEach(r => {
    if (!r.fecha) return;
    const parts = r.fecha.split("/");
    if (parts.length < 3) return;
    const key = `${parts[1]}/${parts[2]}`; // MM/AAAA
    if (!map[key]) map[key] = [];
    map[key].push(r);
  });
  return map;
}

// Genera los últimos N meses en orden cronológico
function ultimos12Meses() {
  const hoy  = new Date();
  const meses = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const yy = String(d.getFullYear());
    meses.push({ key:`${mm}/${yy}`, label:`${MESES[d.getMonth()]} ${yy.slice(2)}` });
  }
  return meses;
}

// ─── GRÁFICO DE BARRAS ────────────────────────────────────────────────────────
function BarChart({ meses, series, height=200 }) {
  const [tooltip, setTooltip] = useState(null);
  const maxVal = Math.max(1, ...meses.map(m => series.reduce((s,sr) => s + (sr.data[m.key]||0), 0)));

  return (
    <div style={{ position:"relative" }}>
      {/* Leyenda */}
      <div style={{ display:"flex",gap:16,marginBottom:16,flexWrap:"wrap" }}>
        {series.map(sr => (
          <div key={sr.key} style={{ display:"flex",alignItems:"center",gap:6,fontSize:12 }}>
            <div style={{ width:12,height:12,borderRadius:3,background:sr.color,flexShrink:0 }} />
            <span style={{ color:"var(--muted)" }}>{sr.label}</span>
          </div>
        ))}
      </div>

      {/* Barras */}
      <div style={{ display:"flex",alignItems:"flex-end",gap:6,height,paddingBottom:28,overflowX:"auto" }}>
        {meses.map(m => {
          const vals  = series.map(sr => sr.data[m.key] || 0);
          const total = vals.reduce((a,b) => a+b, 0);
          return (
            <div key={m.key}
              onMouseEnter={() => setTooltip({ mes:m, vals, total })}
              onMouseLeave={() => setTooltip(null)}
              style={{ display:"flex",flexDirection:"column",alignItems:"center",gap:2,flex:"0 0 auto",width:48,cursor:"default" }}>
              {/* Barras apiladas */}
              <div style={{ width:"100%",display:"flex",flexDirection:"column-reverse",gap:2,height:height-28 }}>
                {series.map((sr,si) => {
                  const v   = sr.data[m.key] || 0;
                  const pct = v / maxVal;
                  return (
                    <div key={sr.key} style={{
                      width:"100%",
                      height:`${Math.max(pct*(height-28), v>0?4:0)}px`,
                      background:`linear-gradient(180deg,${sr.color},${sr.color}bb)`,
                      borderRadius: si===series.length-1?"6px 6px 0 0":"0",
                      transition:"height .5s ease",
                      position:"relative",
                    }}>
                      {v > 0 && pct > 0.12 && (
                        <span style={{ position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",fontSize:10,fontWeight:700,color:"#fff" }}>{v}</span>
                      )}
                    </div>
                  );
                })}
              </div>
              {/* Label mes */}
              <span style={{ fontSize:10,color:"var(--muted)",whiteSpace:"nowrap",marginTop:4 }}>{m.label}</span>
            </div>
          );
        })}
      </div>

      {/* Tooltip */}
      {tooltip && (
        <div style={{ position:"absolute",top:0,right:0,background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 16px",minWidth:160,zIndex:10,boxShadow:"0 8px 24px rgba(0,0,0,.4)" }}>
          <div style={{ fontWeight:700,fontSize:13,marginBottom:8 }}>{tooltip.mes.key}</div>
          {series.map((sr,i) => (
            <div key={sr.key} style={{ display:"flex",justifyContent:"space-between",gap:16,fontSize:12,color:"var(--muted)",marginBottom:4 }}>
              <span style={{ color:sr.color }}>{sr.label}</span>
              <span style={{ fontWeight:600,color:"var(--text)" }}>{tooltip.vals[i]}</span>
            </div>
          ))}
          <div style={{ borderTop:"1px solid var(--border)",marginTop:8,paddingTop:8,display:"flex",justifyContent:"space-between",fontSize:12,fontWeight:700 }}>
            <span style={{ color:"var(--muted)" }}>Total</span>
            <span>{tooltip.total}</span>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({ data, sheets }) {
  const [vistaGrafico, setVistaGrafico] = useState("procesados"); // procesados | total
  const [mesesVista,   setMesesVista]   = useState(6);

  const sucKeys = Object.keys(data).filter(k => Array.isArray(data[k]));
  const todos   = sucKeys.flatMap(k => (data[k]||[]).map(r => ({ ...r, _suc:k })));

  const hoy    = new Date();
  const mesAct = String(hoy.getMonth()+1).padStart(2,"0");
  const anioAct= String(hoy.getFullYear());

  // Stats globales
  const total    = todos.length;
  const clientes = new Set(todos.map(r => r.cliente).filter(Boolean)).size;
  const delMes   = todos.filter(r => r.fecha && r.fecha.slice(3,5) === mesAct && r.fecha.slice(6) === anioAct).length;
  const procTotal= todos.filter(r => IS_PROC(r.procesado)).length;
  const pctTotal = total ? Math.round((procTotal/total)*100) : 0;

  // Stats por sucursal para cards
  const statsPorSuc = sucKeys.map(k => {
    const arr  = data[k] || [];
    const proc = arr.filter(r => IS_PROC(r.procesado)).length;
    const pend = arr.length - proc;
    const cfg  = sheets[k] || { label:k, color:"#6c63ff", colorBg:"rgba(108,99,255,.12)", icon:"🏢" };
    return { key:k, label:cfg.label, color:cfg.color, colorBg:cfg.colorBg, icon:cfg.icon, total:arr.length, proc, pend, pct:arr.length?Math.round(proc/arr.length*100):0 };
  });

  // Datos mensuales para el gráfico
  const meses12   = ultimos12Meses();
  const mesesShow = meses12.slice(-mesesVista);

  const seriesGrafico = sucKeys.map(k => {
    const arr = data[k] || [];
    const cfg = sheets[k] || { label:k, color:"#6c63ff" };
    const porMes = agruparPorMes(arr);
    const dataPts = {};
    meses12.forEach(m => {
      const rem = porMes[m.key] || [];
      dataPts[m.key] = vistaGrafico === "procesados"
        ? rem.filter(r => IS_PROC(r.procesado)).length
        : rem.length;
    });
    return { key:k, label:cfg.label, color:cfg.color, data:dataPts };
  });

  // Tabla mensual detallada (últimos 12 meses)
  const tablaData = meses12.slice().reverse().map(m => {
    const fila = { mes: m.label, key: m.key };
    let totalMes = 0, procMes = 0;
    sucKeys.forEach(k => {
      const arr   = data[k] || [];
      const porMes= agruparPorMes(arr);
      const rem   = porMes[m.key] || [];
      const proc  = rem.filter(r => IS_PROC(r.procesado)).length;
      fila[`total_${k}`] = rem.length;
      fila[`proc_${k}`]  = proc;
      totalMes += rem.length;
      procMes  += proc;
    });
    fila.totalMes = totalMes;
    fila.procMes  = procMes;
    fila.pctMes   = totalMes ? Math.round(procMes/totalMes*100) : 0;
    return fila;
  }).filter(f => f.totalMes > 0);

  return (
    <div className="fade-in" style={{ marginBottom:32 }}>
      <div style={{ fontFamily:"Syne",fontWeight:800,fontSize:20,marginBottom:20,display:"flex",alignItems:"center",gap:10 }}>
        📊 <span>Dashboard</span>
        <span style={{ fontSize:12,fontWeight:400,color:"var(--muted)",fontFamily:"DM Sans" }}>Resumen en tiempo real</span>
      </div>

      {/* ── CARDS GLOBALES ── */}
      <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10,marginBottom:24 }}>
        {[
          { icon:"📄", label:"Total remitos",    val:total,       color:"#2756d6" },
          { icon:"🏢", label:"Clientes únicos",  val:clientes,    color:"#8b5cf6" },
          { icon:"📅", label:"Este mes",          val:delMes,      color:"#06b6d4" },
          { icon:"✅", label:"Procesados total",  val:procTotal,   color:"#4ade80" },
          { icon:"📊", label:"% Procesado",       val:pctTotal+"%",color:"#34d399" },
          { icon:"⏳", label:"Pendientes",         val:total-procTotal, color:"#f59e0b" },
        ].map((c,i) => (
          <div key={i} className="fade-in" style={{ background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:"14px 16px",animationDelay:`${i*0.04}s` }}>
            <div style={{ fontSize:20,marginBottom:6 }}>{c.icon}</div>
            <div style={{ fontFamily:"Syne",fontWeight:800,fontSize:24,color:c.color }}>{c.val}</div>
            <div style={{ color:"var(--muted)",fontSize:11,marginTop:3 }}>{c.label}</div>
          </div>
        ))}
      </div>

      {/* ── CARDS POR SUCURSAL ── */}
      <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10,marginBottom:28 }}>
        {statsPorSuc.map(s => (
          <div key={s.key} style={{ background:"var(--surface)",border:`1px solid ${s.color}33`,borderRadius:14,padding:"16px 18px" }}>
            <div style={{ display:"flex",alignItems:"center",gap:10,marginBottom:14 }}>
              <div style={{ width:36,height:36,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,background:s.colorBg }}>{s.icon}</div>
              <div>
                <div style={{ fontWeight:700,fontSize:14,color:s.color }}>{s.label}</div>
                <div style={{ color:"var(--muted)",fontSize:11 }}>{s.total} remitos</div>
              </div>
              <span style={{ marginLeft:"auto",fontFamily:"Syne",fontWeight:800,fontSize:20,color:s.color }}>{s.pct}%</span>
            </div>
            <div style={{ background:"rgba(255,255,255,.05)",borderRadius:20,height:6,overflow:"hidden",marginBottom:10 }}>
              <div style={{ width:`${s.pct}%`,height:"100%",background:`linear-gradient(90deg,${s.color}88,${s.color})`,borderRadius:20,transition:"width .6s ease" }} />
            </div>
            <div style={{ display:"flex",justifyContent:"space-between",fontSize:12 }}>
              <span style={{ color:"#4ade80" }}>✓ {s.proc} procesados</span>
              <span style={{ color:"#f59e0b" }}>⏳ {s.pend} pendientes</span>
            </div>
          </div>
        ))}
      </div>

      {/* ── GRÁFICO MENSUAL ── */}
      <div style={{ background:"var(--surface)",border:"1px solid var(--border)",borderRadius:16,padding:"22px 24px",marginBottom:20 }}>
        <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:10 }}>
          <div>
            <div style={{ fontFamily:"Syne",fontWeight:700,fontSize:16 }}>Remitos por mes · por sucursal</div>
            <div style={{ color:"var(--muted)",fontSize:12,marginTop:3 }}>
              {vistaGrafico === "procesados" ? "Procesados confirmados" : "Total ingresados"} — últimos {mesesVista} meses
            </div>
          </div>
          <div style={{ display:"flex",gap:8,alignItems:"center",flexWrap:"wrap" }}>
            {/* Toggle procesados/total */}
            <div style={{ display:"flex",gap:4,background:"var(--surface2)",borderRadius:8,padding:4,border:"1px solid var(--border)" }}>
              {[["procesados","✅ Procesados"],["total","📄 Total"]].map(([v,l]) => (
                <button key={v} onClick={() => setVistaGrafico(v)}
                  style={{ padding:"5px 12px",borderRadius:6,border:vistaGrafico===v?"1px solid var(--border)":"1px solid transparent",
                    background:vistaGrafico===v?"var(--surface)":"none",color:vistaGrafico===v?"var(--text)":"var(--muted)",
                    fontSize:11,fontWeight:500,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap" }}>
                  {l}
                </button>
              ))}
            </div>
            {/* Toggle meses */}
            <div style={{ display:"flex",gap:4,background:"var(--surface2)",borderRadius:8,padding:4,border:"1px solid var(--border)" }}>
              {[3,6,12].map(n => (
                <button key={n} onClick={() => setMesesVista(n)}
                  style={{ padding:"5px 10px",borderRadius:6,border:mesesVista===n?"1px solid var(--border)":"1px solid transparent",
                    background:mesesVista===n?"var(--surface)":"none",color:mesesVista===n?"var(--text)":"var(--muted)",
                    fontSize:11,cursor:"pointer",fontFamily:"inherit" }}>
                  {n}m
                </button>
              ))}
            </div>
          </div>
        </div>
        {sucKeys.length > 0
          ? <BarChart meses={mesesShow} series={seriesGrafico} height={220} />
          : <div style={{ textAlign:"center",padding:"40px 0",color:"var(--muted)" }}>Sin datos para mostrar</div>
        }
      </div>

      {/* ── TABLA MENSUAL DETALLADA ── */}
      <div style={{ background:"var(--surface)",border:"1px solid var(--border)",borderRadius:16,overflow:"hidden" }}>
        <div style={{ padding:"16px 22px",borderBottom:"1px solid var(--border)",background:"var(--surface2)",display:"flex",alignItems:"center",gap:10 }}>
          <span style={{ fontFamily:"Syne",fontWeight:700,fontSize:15 }}>📋 Detalle mensual de procesados</span>
          <span style={{ color:"var(--muted)",fontSize:12 }}>por sucursal</span>
        </div>
        <div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%",borderCollapse:"collapse",fontSize:13 }}>
            <thead>
              <tr style={{ background:"rgba(255,255,255,.03)" }}>
                <th style={{ padding:"10px 16px",textAlign:"left",color:"var(--muted)",fontWeight:600,fontSize:11,textTransform:"uppercase",letterSpacing:".5px",borderBottom:"1px solid var(--border)" }}>Mes</th>
                {sucKeys.map(k => {
                  const cfg = sheets[k] || { label:k, color:"#6c63ff" };
                  return (
                    <React.Fragment key={k}>
                      <th style={{ padding:"10px 10px",textAlign:"right",color:cfg.color,fontWeight:600,fontSize:11,textTransform:"uppercase",letterSpacing:".5px",borderBottom:"1px solid var(--border)",whiteSpace:"nowrap" }}>
                        {cfg.label} Total
                      </th>
                      <th style={{ padding:"10px 10px",textAlign:"right",color:cfg.color,fontWeight:600,fontSize:11,textTransform:"uppercase",letterSpacing:".5px",borderBottom:"1px solid var(--border)",whiteSpace:"nowrap" }}>
                        {cfg.label} Proc.
                      </th>
                    </React.Fragment>
                  );
                })}
                <th style={{ padding:"10px 16px",textAlign:"right",color:"var(--muted)",fontWeight:600,fontSize:11,textTransform:"uppercase",letterSpacing:".5px",borderBottom:"1px solid var(--border)" }}>Total</th>
                <th style={{ padding:"10px 16px",textAlign:"right",color:"#4ade80",fontWeight:600,fontSize:11,textTransform:"uppercase",letterSpacing:".5px",borderBottom:"1px solid var(--border)" }}>Proc.</th>
                <th style={{ padding:"10px 16px",textAlign:"right",color:"var(--muted)",fontWeight:600,fontSize:11,textTransform:"uppercase",letterSpacing:".5px",borderBottom:"1px solid var(--border)" }}>%</th>
              </tr>
            </thead>
            <tbody>
              {tablaData.length === 0
                ? <tr><td colSpan={3+sucKeys.length*2} style={{ textAlign:"center",padding:"30px",color:"var(--muted)" }}>Sin datos</td></tr>
                : tablaData.map((f,i) => {
                  const esActual = f.key === `${mesAct}/${anioAct}`;
                  return (
                    <tr key={f.key} style={{ background:esActual?"rgba(39,86,214,.06)":i%2===0?"transparent":"rgba(255,255,255,.015)",borderBottom:"1px solid var(--border)" }}>
                      <td style={{ padding:"10px 16px",fontWeight:esActual?700:400,color:esActual?"#7b9af0":"var(--text)",whiteSpace:"nowrap" }}>
                        {f.mes}{esActual && <span style={{ marginLeft:6,fontSize:10,background:"rgba(39,86,214,.2)",color:"#7b9af0",padding:"1px 6px",borderRadius:20 }}>actual</span>}
                      </td>
                      {sucKeys.map(k => {
                        const cfg = sheets[k] || { color:"#6c63ff" };
                        return (
                          <React.Fragment key={k}>
                            <td style={{ padding:"10px 10px",textAlign:"right",color:"var(--muted)" }}>{f[`total_${k}`]||0}</td>
                            <td style={{ padding:"10px 10px",textAlign:"right",color:cfg.color,fontWeight:600 }}>{f[`proc_${k}`]||0}</td>
                          </React.Fragment>
                        );
                      })}
                      <td style={{ padding:"10px 16px",textAlign:"right",fontWeight:600 }}>{f.totalMes}</td>
                      <td style={{ padding:"10px 16px",textAlign:"right",color:"#4ade80",fontWeight:700 }}>{f.procMes}</td>
                      <td style={{ padding:"10px 16px",textAlign:"right" }}>
                        <span style={{ padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:600,
                          background:f.pctMes>=80?"rgba(74,222,128,.1)":f.pctMes>=50?"rgba(245,158,11,.1)":"rgba(255,101,132,.1)",
                          color:f.pctMes>=80?"#4ade80":f.pctMes>=50?"#f59e0b":"#ff6584" }}>
                          {f.pctMes}%
                        </span>
                      </td>
                    </tr>
                  );
                })
              }
            </tbody>
            {tablaData.length > 0 && (() => {
              const totales = sucKeys.map(k => ({
                total: tablaData.reduce((s,f) => s+(f[`total_${k}`]||0),0),
                proc:  tablaData.reduce((s,f) => s+(f[`proc_${k}`]||0),0),
              }));
              const gtotal = tablaData.reduce((s,f)=>s+f.totalMes,0);
              const gproc  = tablaData.reduce((s,f)=>s+f.procMes,0);
              const gpct   = gtotal ? Math.round(gproc/gtotal*100) : 0;
              return (
                <tfoot>
                  <tr style={{ background:"rgba(39,86,214,.08)",borderTop:"2px solid rgba(39,86,214,.3)" }}>
                    <td style={{ padding:"12px 16px",fontFamily:"Syne",fontWeight:700,fontSize:13 }}>TOTAL</td>
                    {totales.map((t,i) => {
                      const cfg = sheets[sucKeys[i]] || { color:"#6c63ff" };
                      return (
                        <React.Fragment key={i}>
                          <td style={{ padding:"12px 10px",textAlign:"right",fontWeight:600,color:"var(--muted)" }}>{t.total}</td>
                          <td style={{ padding:"12px 10px",textAlign:"right",fontWeight:700,color:cfg.color }}>{t.proc}</td>
                        </React.Fragment>
                      );
                    })}
                    <td style={{ padding:"12px 16px",textAlign:"right",fontWeight:700 }}>{gtotal}</td>
                    <td style={{ padding:"12px 16px",textAlign:"right",fontWeight:700,color:"#4ade80" }}>{gproc}</td>
                    <td style={{ padding:"12px 16px",textAlign:"right" }}>
                      <span style={{ padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:700,
                        background:gpct>=80?"rgba(74,222,128,.15)":gpct>=50?"rgba(245,158,11,.15)":"rgba(255,101,132,.15)",
                        color:gpct>=80?"#4ade80":gpct>=50?"#f59e0b":"#ff6584" }}>
                        {gpct}%
                      </span>
                    </td>
                  </tr>
                </tfoot>
              );
            })()}
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── TABLA ───────────────────────────────────────────────────────────────────
function RemitosTable({ remitos, loading, error, sucursalKey, isAdmin, onView, showSucBadge, onMarcarProcesado }) {
  const [search,   setSearch]   = useState("");
  const [sortBy,   setSortBy]   = useState("fecha");
  const [sortDir,  setSortDir]  = useState("desc");
  const [filterP,  setFilterP]  = useState("todos");
  const [fechaDesde, setFechaDesde] = useState("");
  const [fechaHasta, setFechaHasta] = useState("");
  const [marking,  setMarking]  = useState(null); // rowIndex siendo marcado
  const suc = SHEETS[sucursalKey] || SHEETS.santafe;

  // Parsear DD/MM/AAAA → Date para comparar rangos
  const parseDate = (str) => {
    if (!str) return null;
    const [d,m,y] = str.split("/");
    if (!d||!m||!y) return null;
    return new Date(+y, +m-1, +d);
  };

  const filtered = useMemo(() => {
    const q = search.toLowerCase().trim();
    const desde = fechaDesde ? parseDate(fechaDesde) : null;
    const hasta = fechaHasta ? parseDate(fechaHasta) : null;
    return remitos
      .filter(r => {
        const m = !q || [r.archivo,r.remito,r.cliente,r.fecha].some(f => f.toLowerCase().includes(q));
        if (!m) return false;
        // Filtro de rango de fechas
        if (desde || hasta) {
          const rf = parseDate(r.fecha);
          if (!rf) return false;
          if (desde && rf < desde) return false;
          if (hasta && rf > hasta) return false;
        }
        if (!isAdmin || filterP === "todos") return true;
        const v = (r.procesado||"").toLowerCase();
        const isp = ["si","sí","yes","true","1","x"].includes(v);
        return filterP === "si" ? isp : !isp;
      })
      .sort((a, b) => {
        const va = (a[sortBy]||"").toLowerCase(), vb = (b[sortBy]||"").toLowerCase();
        return sortDir === "asc" ? va.localeCompare(vb) : vb.localeCompare(va);
      });
  }, [remitos, search, sortBy, sortDir, filterP, isAdmin, fechaDesde, fechaHasta]);

  const handleMarcar = async (r, sucKey) => {
    if (!onMarcarProcesado) return;
    const esProcesado = ["si","sí","yes","true","1","x"].includes((r.procesado||"").toLowerCase());
    setMarking(r.rowIndex);
    try {
      await onMarcarProcesado(sucKey || sucursalKey, r, !esProcesado);
    } finally {
      setMarking(null);
    }
  };

  const toggleSort = col => {
    if (sortBy === col) setSortDir(d => d === "asc" ? "desc" : "asc");
    else { setSortBy(col); setSortDir("asc"); }
  };

  const SortIcon = ({ col }) => sortBy === col
    ? <span style={{ color:suc.color }}>{sortDir==="asc"?" ↑":" ↓"}</span>
    : <span style={{ color:"var(--muted)",opacity:.35 }}> ↕</span>;

  const cols = [
    { key:"archivo", label:"Archivo" },
    ...(showSucBadge ? [{ key:"_suc", label:"Sucursal" }] : []),
    { key:"remito",  label:"Remito" },
    { key:"fecha",   label:"Fecha" },
    { key:"cliente", label:"Cliente" },
    ...(isAdmin ? [{ key:"procesado", label:"Procesado" }] : []),
  ];
  const colCount = cols.length + 1;
  const gridCols = cols.map((c,i) => i === 0 || i === cols.length-1 ? "1fr" : "auto").join(" ") + " 120px";

  return (
    <div>
      <div style={{ display:"flex",gap:10,marginBottom:18,flexWrap:"wrap",alignItems:"center" }}>
        <div style={{ flex:1,minWidth:220,position:"relative" }}>
          <span style={{ position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",color:"var(--muted)" }}>🔍</span>
          <input value={search} onChange={e => setSearch(e.target.value)} aria-label="Buscar remitos"
            placeholder="Buscar por archivo, remito, cliente, fecha..."
            style={{ width:"100%",padding:"11px 14px 11px 44px",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text)",fontSize:14,outline:"none" }}
            onFocus={e => e.target.style.borderColor=suc.color}
            onBlur={e => e.target.style.borderColor="var(--border)"} />
        </div>
        {/* Filtro por rango de fechas */}
        <div style={{ display:"flex",alignItems:"center",gap:6,background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,padding:"6px 12px" }}>
          <span style={{ color:"var(--muted)",fontSize:12,whiteSpace:"nowrap" }}>📅 Desde</span>
          <input type="text" value={fechaDesde} onChange={e => setFechaDesde(e.target.value)}
            placeholder="DD/MM/AAAA" maxLength={10}
            style={{ background:"none",border:"none",color:"var(--text)",fontSize:13,outline:"none",width:96 }} />
          <span style={{ color:"var(--muted)",fontSize:12 }}>–</span>
          <input type="text" value={fechaHasta} onChange={e => setFechaHasta(e.target.value)}
            placeholder="DD/MM/AAAA" maxLength={10}
            style={{ background:"none",border:"none",color:"var(--text)",fontSize:13,outline:"none",width:96 }} />
          {(fechaDesde||fechaHasta) && (
            <button onClick={() => { setFechaDesde(""); setFechaHasta(""); }}
              style={{ background:"none",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:14,padding:0,lineHeight:1 }} title="Limpiar fechas">✕</button>
          )}
        </div>
        {isAdmin && (
          <div role="group" style={{ display:"flex",gap:4,background:"var(--surface2)",borderRadius:8,padding:4,border:"1px solid var(--border)" }}>
            {[["todos","Todos"],["si","✓ Procesado"],["no","✗ Pendiente"]].map(([v,l]) => (
              <button key={v} onClick={() => setFilterP(v)} style={{
                background:filterP===v?"var(--surface)":"none", border:filterP===v?"1px solid var(--border)":"1px solid transparent",
                borderRadius:6, color:filterP===v?"var(--text)":"var(--muted)", fontSize:12, fontWeight:500,
                padding:"5px 12px", cursor:"pointer", fontFamily:"inherit", transition:"all .15s"
              }}>{l}</button>
            ))}
          </div>
        )}
        {[
          { label:"Total",     val:remitos.length,  icon:"📄" },
          { label:"Filtrados", val:filtered.length, icon:"🔎" },
          { label:"Clientes",  val:new Set(remitos.map(r=>r.cliente)).size, icon:"🏢" },
        ].map(s => (
          <div key={s.label} style={{ background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"7px 14px",display:"flex",alignItems:"center",gap:7 }}>
            <span style={{ fontSize:13 }}>{s.icon}</span>
            <span style={{ fontFamily:"Syne",fontWeight:700,fontSize:15 }}>{s.val}</span>
            <span style={{ color:"var(--muted)",fontSize:11 }}>{s.label}</span>
          </div>
        ))}
      </div>

      <div style={{ background:"var(--surface)",border:"1px solid var(--border)",borderRadius:16,overflow:"hidden" }}>
        <div role="row" style={{ display:"grid",gridTemplateColumns:gridCols,padding:"12px 20px",borderBottom:"1px solid var(--border)",background:"var(--surface2)" }}>
          {cols.map(col => col.key === "_suc"
            ? <div key="_suc" role="columnheader" style={{ color:"var(--muted)",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:".5px" }}>Sucursal</div>
            : <button key={col.key} onClick={() => toggleSort(col.key)} aria-label={`Ordenar ${col.label}`}
                style={{ background:"none",border:"none",cursor:"pointer",color:"var(--muted)",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:".5px",textAlign:"left",padding:0,fontFamily:"inherit" }}>
                {col.label}<SortIcon col={col.key} />
              </button>
          )}
          <div role="columnheader" style={{ color:"var(--muted)",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:".5px" }}>Acciones</div>
        </div>

        {loading ? (
          <div style={{ textAlign:"center",padding:"70px 20px",color:"var(--muted)" }}>
            <div style={{ fontSize:32,marginBottom:16,animation:"spin 1.5s linear infinite",display:"inline-block" }}>⟳</div>
            <div>Cargando remitos...</div>
          </div>
        ) : error ? (
          <div role="alert" style={{ textAlign:"center",padding:"70px 20px" }}>
            <div style={{ fontSize:36,marginBottom:10 }}>⚠️</div>
            <div style={{ color:"var(--accent2)",marginBottom:6 }}>{error}</div>
          </div>
        ) : filtered.length === 0 ? (
          <div style={{ textAlign:"center",padding:"70px 20px",color:"var(--muted)" }}>
            <div style={{ fontSize:32,marginBottom:14 }}>🗂️</div>
            <div>{remitos.length===0?"No hay remitos":"Sin resultados"}</div>
          </div>
        ) : filtered.map((r, i) => (
          <div key={i} role="row" className="fade-in row-hover" style={{
            display:"grid",gridTemplateColumns:gridCols,padding:"14px 20px",alignItems:"center",
            borderBottom:i<filtered.length-1?"1px solid var(--border)":"none",
            animationDelay:`${Math.min(i*.02,.28)}s`
          }}>
            <div style={{ fontSize:14,fontWeight:500,paddingRight:8,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }} title={r.archivo}>{r.archivo||"—"}</div>
            {showSucBadge && (
              <div><span className="tag" style={{ background:SHEETS[r._suc]?.colorBg,color:SHEETS[r._suc]?.color }}>{SHEETS[r._suc]?.icon} {SHEETS[r._suc]?.label}</span></div>
            )}
            <div><span className="tag" style={{ background:suc.colorBg,color:suc.color,fontFamily:"Syne",fontWeight:700 }}>#{r.remito}</span></div>
            <div style={{ color:"var(--muted)",fontSize:13 }}>{r.fecha}</div>
            <div style={{ fontSize:14,paddingRight:8,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }} title={r.cliente}>{r.cliente}</div>
            {isAdmin && <div><ProcesadoBadge value={r.procesado} /></div>}
            <div style={{ display:"flex",gap:5,flexWrap:"wrap" }}>
              {r.link
                ? <>
                    <button className="btn btn-ghost" onClick={() => onView(r, r._suc||sucursalKey)} style={{ padding:"6px 11px",fontSize:12 }}>👁 Ver</button>
                    <a href={r.link} target="_blank" rel="noopener noreferrer" className="btn btn-ghost" style={{ padding:"6px 10px",fontSize:13,textDecoration:"none" }} aria-label="Descargar">⬇</a>
                  </>
                : <span style={{ color:"var(--muted)",fontSize:12 }}>Sin archivo</span>
              }
              {isAdmin && onMarcarProcesado && (() => {
                const esProcesado = ["si","sí","yes","true","1","x"].includes((r.procesado||"").toLowerCase());
                const isLoading   = marking === r.rowIndex;
                return (
                  <button
                    onClick={() => handleMarcar(r, r._suc)}
                    disabled={isLoading}
                    title={esProcesado ? "Marcar como pendiente" : "Marcar como procesado"}
                    style={{
                      padding:"6px 10px", fontSize:11, borderRadius:8, border:"none", cursor:"pointer",
                      background: esProcesado ? "rgba(74,222,128,.1)" : "rgba(245,158,11,.1)",
                      color: esProcesado ? "#4ade80" : "#f59e0b",
                      opacity: isLoading ? .5 : 1, transition:"all .2s", fontFamily:"inherit",
                    }}>
                    {isLoading ? "⟳" : esProcesado ? "✓" : "○"}
                  </button>
                );
              })()}
            </div>
          </div>
        ))}
      </div>

      {filtered.length > 0 && (
        <div style={{ textAlign:"center",marginTop:12,color:"var(--muted)",fontSize:12 }}>
          Mostrando {filtered.length} de {remitos.length} remitos
        </div>
      )}
    </div>
  );
}



// ─── APP PRINCIPAL ────────────────────────────────────────────────────────────
function RemitosApp({ user, onLogout }) {
  const isAdmin = user.role === "admin";

  // Sucursales dinámicas cargadas del servidor
  const [sheets,      setSheets]     = useState(() => buildSheetsMap(user.sucursales || []));
  const [sucList,     setSucList]    = useState(user.sucursales || []);
  const [showGestion, setShowGestion]= useState(false);

  const sucKeys = useMemo(() => Object.keys(sheets), [sheets]);
  const tabs    = isAdmin ? [...sucKeys, "todos"] : [user.sucursal];
  const [activeTab, setActiveTab] = useState(tabs[0] || "todos");

  const [data,        setData]       = useState({});
  const [loading,     setLoading]    = useState({});
  const [errors,      setErrors]     = useState({});
  const [selected,    setSelected]   = useState(null);
  const [selectedSuc, setSelectedSuc]= useState(null);
  const { canInstall, install } = usePWAInstall();
  const sessionWarn = useSessionTimeout(true, onLogout);
  const [showDash, setShowDash] = useState(isAdmin);

  const loadSheet = useCallback(async key => {
    setLoading(p => ({ ...p, [key]:true }));
    setErrors(p => ({ ...p, [key]:"" }));
    try {
      const r = await fetchRemitos(key, user.role, user.token);
      setData(p => ({ ...p, [key]:r }));
    } catch (e) {
      setErrors(p => ({ ...p, [key]:e.message }));
    } finally {
      setLoading(p => ({ ...p, [key]:false }));
    }
  }, [user]);

  const handleMarcarProcesado = useCallback(async (sucursal, remito, valor) => {
    await marcarProcesado(sucursal, remito.remito, remito.rowIndex, valor, user.token);
    setData(prev => ({
      ...prev,
      [sucursal]: (prev[sucursal] || []).map(r =>
        r.rowIndex === remito.rowIndex ? { ...r, procesado: valor ? "Si" : "" } : r
      ),
    }));
  }, [user.token]);

  const reloadSucursales = useCallback(async () => {
    try {
      const arr = await apiGetSucursales(user.token);
      setSucList(arr);
      setSheets(buildSheetsMap(arr));
    } catch {}
  }, [user.token]);

  const handleAddSucursal = async (slug, label, icon, color) => {
    const res = await apiAddSucursal(slug, label, icon, color, user.token);
    if (res.ok) await reloadSucursales();
    return res;
  };

  const handleDeleteSucursal = async (slug) => {
    const res = await apiDeleteSucursal(slug, user.token);
    if (res.ok) {
      await reloadSucursales();
      if (activeTab === slug) setActiveTab(sucKeys[0] || "todos");
    }
    return res;
  };

  useEffect(() => {
    const keys = isAdmin ? sucKeys : [user.sucursal];
    keys.forEach(loadSheet);
  }, []);

  const todosData = useMemo(() =>
    sucKeys.flatMap(k => (data[k] || []).map(r => ({ ...r, _suc:k }))),
  [data, sucKeys]);

  const tabCfg = useMemo(() => ({
    ...Object.fromEntries(sucKeys.map(k => [k, sheets[k] || { label:k, icon:"🏢", color:"#2756d6", colorBg:"rgba(39,86,214,.12)" }])),
    todos: { label:"Todos", icon:"📊", color:"#8899cc", colorBg:"rgba(136,153,204,.1)" },
  }), [sheets, sucKeys]);

  return (
    <div style={{ minHeight:"100vh",background:"var(--bg)" }}>
      <nav style={{ position:"sticky",top:0,zIndex:100,background:"rgba(10,12,20,.92)",backdropFilter:"blur(20px)",borderBottom:"1px solid var(--border)",padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",height:62 }}>
        <div style={{ display:"flex",alignItems:"center",gap:12 }}>
          <div style={{ width:34,height:34,borderRadius:8,background:"var(--accent)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18 }}>🗂️</div>
          <div>
            <div style={{ fontFamily:"Syne",fontWeight:800,fontSize:16,lineHeight:1.1 }}>File Protection</div>
            <div style={{ color:"var(--muted)",fontSize:10,letterSpacing:".5px" }}>SISTEMA DE REMITOS</div>
          </div>
          {isAdmin && <span className="tag" style={{ background:"rgba(74,222,128,.1)",color:"#4ade80",marginLeft:6,fontSize:10,border:"1px solid rgba(74,222,128,.2)" }}>ADMIN</span>}
        </div>
        <div style={{ display:"flex",alignItems:"center",gap:12 }}>
          <div style={{ textAlign:"right" }}>
            <div style={{ fontSize:13,fontWeight:500 }}>{user.name}</div>
            {!isAdmin && <div style={{ fontSize:11,color:sheets[user.sucursal]?.color }}>{sheets[user.sucursal]?.icon} {sheets[user.sucursal]?.label}</div>}
          </div>
          {isAdmin && (
            <button className="btn btn-ghost" onClick={() => setShowGestion(true)} style={{ fontSize:12,padding:"7px 12px" }}>🏢 Sucursales</button>
          )}
          <button className="btn btn-danger" onClick={onLogout} style={{ fontSize:12,padding:"7px 14px" }}>Salir</button>
        </div>
      </nav>

      {sessionWarn && (
        <div className="session-warn" role="alert">⏱ Tu sesión expirará en 2 minutos por inactividad</div>
      )}

      <div style={{ maxWidth:1240,margin:"0 auto",padding:"28px 24px" }}>
        {isAdmin && (
          <div style={{ display:"flex",gap:8,marginBottom:26,flexWrap:"wrap",alignItems:"center" }}>
            {tabs.map(tab => {
              const cfg = tabCfg[tab];
              const isActive = activeTab === tab;
              const count = tab==="todos" ? data.santafe.length+data.rosario.length : data[tab]?.length;
              return (
                <button key={tab} className={`tab-btn ${isActive?"active":""}`} onClick={() => { setActiveTab(tab); setShowDash(false); }}
                  style={isActive && !showDash ? { background:`${cfg.color}18`,borderColor:`${cfg.color}44`,color:cfg.color } : {}}>
                  {cfg.icon} <span style={{ fontWeight:isActive?600:400 }}>{cfg.label}</span>
                  {count > 0 && <span className="tag" style={{ background:`${cfg.color}18`,color:cfg.color,padding:"2px 8px",fontSize:10 }}>{count}</span>}
                </button>
              );
            })}
            <button className={`tab-btn ${showDash?"active":""}`} onClick={() => setShowDash(d => !d)}
              style={showDash ? { background:"rgba(139,92,246,.15)",borderColor:"rgba(139,92,246,.4)",color:"#a78bfa" } : {}}>
              📊 Dashboard
            </button>
            <button className="btn btn-ghost" onClick={() => ["santafe","rosario"].forEach(loadSheet)} style={{ fontSize:12,marginLeft:"auto" }}>🔄 Actualizar</button>
          </div>
        )}
        {isAdmin && showDash && (
          <Dashboard data={data} sheets={sheets || DEFAULT_SHEETS} />
        )}

        {!isAdmin && (
          <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:26 }}>
            <div style={{ display:"flex",alignItems:"center",gap:14 }}>
              <div style={{ width:48,height:48,borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,background:SHEETS[user.sucursal].colorBg,border:`1px solid ${SHEETS[user.sucursal].color}33` }}>
                {SHEETS[user.sucursal].icon}
              </div>
              <div>
                <div style={{ fontFamily:"Syne",fontWeight:800,fontSize:22 }}>{SHEETS[user.sucursal].label}</div>
                <div style={{ color:"var(--muted)",fontSize:13 }}>Remitos de tu sucursal</div>
              </div>
            </div>
            <button className="btn btn-ghost" onClick={() => loadSheet(user.sucursal)} style={{ fontSize:12 }}>🔄 Actualizar</button>
          </div>
        )}

        {!showDash && (activeTab === "todos"
          ? <RemitosTable remitos={todosData} loading={loading.santafe||loading.rosario} error={errors.santafe||errors.rosario} sucursalKey="santafe" isAdmin={isAdmin} onView={(r,s) => { setSelected(r); setSelectedSuc(s); }} showSucBadge onMarcarProcesado={handleMarcarProcesado} />
          : <RemitosTable remitos={data[activeTab]||[]} loading={loading[activeTab]} error={errors[activeTab]} sucursalKey={activeTab} isAdmin={isAdmin} onView={(r,s) => { setSelected(r); setSelectedSuc(s||activeTab); }} showSucBadge={false} onMarcarProcesado={handleMarcarProcesado} />
        )}
      </div>

      <footer style={{ borderTop:"1px solid var(--border)",padding:"16px 24px",display:"flex",alignItems:"center",justifyContent:"center",marginTop:32 }}>
        <span style={{ color:"var(--muted)",fontSize:12 }}>File Protection · Sistema de Remitos · v3.0 · Sheet Auth</span>
      </footer>

      {selected && selectedSuc && (
        <FileModal
          remito={selected}
          sucursalKey={selectedSuc}
          isAdmin={isAdmin}
          user={user}
          onClose={() => { setSelected(null); setSelectedSuc(null); }}
          onProcesado={(rowIndex, accion) => {
            // Actualizar estado local sin recargar
            const suc = selectedSuc;
            setData(prev => ({
              ...prev,
              [suc]: (prev[suc] || []).map(r =>
                r.rowIndex === rowIndex
                  ? { ...r, procesado: accion === 'ok' ? 'OK' : '' }
                  : r
              ),
            }));
          }}
          onEdited={(rowIndex, campos) => {
            const suc = selectedSuc;
            setData(prev => ({
              ...prev,
              [suc]: (prev[suc] || []).map(r =>
                r.rowIndex === rowIndex ? { ...r, ...campos } : r
              ),
            }));
            // Actualizar el remito seleccionado también
            setSelected(prev => prev ? { ...prev, ...campos } : prev);
          }}
        />
      )}

      {canInstall && (
        <div className="pwa-banner">
          <span style={{ fontSize:20 }}>📱</span>
          <div>
            <div style={{ fontSize:13,fontWeight:600 }}>Instalá la app</div>
            <div style={{ color:"var(--muted)",fontSize:11 }}>Acceso rápido y funciona offline</div>
          </div>
          <button className="btn btn-primary" onClick={install} style={{ fontSize:12,padding:"7px 16px" }}>Instalar</button>
        </div>
      )}
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const handleLogout = useCallback(async () => {
    if (user?.token) await apiLogout(user.token);
    setUser(null);
  }, [user]);
  return (
    <>
      <GlobalStyle />
      {user ? <RemitosApp user={user} onLogout={handleLogout} /> : <LoginScreen onLogin={setUser} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(reg => {
        reg.addEventListener("updatefound", () => {
          const w = reg.installing;
          w.addEventListener("statechange", () => {
            if (w.state === "installed" && navigator.serviceWorker.controller) {
              if (confirm("Nueva versión disponible. ¿Actualizar?")) window.location.reload();
            }
          });
        });
      }).catch(() => {});
  });
}
</script>
</body>
</html>
